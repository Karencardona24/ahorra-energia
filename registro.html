<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar un aparato</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container py-3">
    <header class="p-4 mb-4 bg-info text-dark rounded">
        <h1>Registrar un nuevo electrodoméstico</h1>
        <p>Llena los datos del aparato para calcular su consumo aproximado.</p>
        <nav class="nav nav-pills">
            <a class="nav-link text-dark" href="index.html">Inicio</a>
            <a class="nav-link text-dark" href="equipos.html">Electrodomésticos</a>
            <a class="nav-link text-dark fw-bold" href="registro.html">Registrar aparato</a>
            <a class="nav-link text-dark" href="mi-factura.html">Mi Factura</a>
            <a class="nav-link text-dark" href="encuesta.html">Encuesta</a>
        </nav>
    </header>

    <main>
        <form action="registro.html" method="get">
            <fieldset class="border rounded p-3 mb-3">
                <legend>Datos técnicos</legend>
                <p>
                    <label for="nombre_aparato">Nombre del aparato:</label>
                    <input class="form-control" type="text" id="nombre_aparato" name="nombre_aparato" required placeholder="Ej.: Horno microondas">
                </p>
                <p>
                    <label for="vatios">Potencia (W):</label>
                    <input class="form-control" type="number" id="vatios" name="vatios" min="1" max="10000" required>
                </p>
                <p>
                    <label for="uso_diario">Horas de uso al día:</label>
                    <input class="form-control" type="number" id="uso_diario" name="uso_diario" min="0" max="24" step="0.5" required>
                </p>
                <p>
                    <label for="clasificacion">¿Qué tipo de energía usa principalmente?</label>
                    <select class="form-select" id="clasificacion" name="clasificacion">
                        <option value="calor">Genera calor (Ducha, plancha, estufa)</option>
                        <option value="frio">Genera frío (Nevera, aire)</option>
                        <option value="motor">Tiene motor (Lavadora, licuadora)</option>
                        <option value="pantalla">Pantallas o tecnología (TV, PC)</option>
                    </select>
                </p>
            </fieldset>

            <fieldset class="border rounded p-3 mb-3">
                <legend>Información adicional</legend>
                <p>¿En qué franja horaria lo usan más?</p>
                <input type="radio" id="manana" name="horario" value="manana" checked>
                <label for="manana">En la mañana</label>
                <input type="radio" id="tarde" name="horario" value="tarde">
                <label for="tarde">En la tarde</label>
                <input type="radio" id="noche" name="horario" value="noche">
                <label for="noche">En la noche</label>

                <p class="mt-3">
                    <input type="checkbox" id="apagado_total" name="apagado_total" value="si">
                    <label for="apagado_total">Lo desconectamos cuando no se usa</label>
                </p>

                <p>
                    <label for="fecha_reg">Fecha en que se registra:</label>
                    <input class="form-control" type="date" id="fecha_reg" name="fecha_reg">
                </p>

                <p>
                    <label for="comentarios">Comentarios extra:</label><br>
                    <textarea class="form-control" id="comentarios" name="comentarios" rows="3" placeholder="Ej.: Es un aparato muy viejo..."></textarea>
                </p>
            </fieldset>

            <button class="btn btn-info text-dark fw-bold" type="submit">Registrar Aparato</button>
            <button class="btn btn-secondary" type="reset">Borrar Datos</button>
        </form>
    </main>

    <footer class="mt-5 text-muted border-top pt-3">
        <p>Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
    </footer>
</body>
</html>
